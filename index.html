---
layout: default
---

<p class="intro-text">Pedagogia sociale · Filosofia dell'educazione · Progettazione sociale</p>

<h2>Appunti</h2>

<div class="post-list">
  {% for post in site.posts %}
  <div class="post-item">
    <span class="post-date">{{ post.date | date: "%d.%m.%Y" }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </div>
  {% else %}
  <p>In attesa del primo appunto.</p>
  {% endfor %}
</div>

<p class="intro-text"><a href="{{ '/blog/' | relative_url }}">Archivio appunti</a> · <a href="{{ '/bio/' | relative_url }}">Curriculum</a></p>
